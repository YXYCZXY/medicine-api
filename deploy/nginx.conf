server {
    listen 80;
    server_name api.uk-io.com;
    return 308 https://api.uk-io.com$request_uri;
}

server {
    listen 443 ssl;
    server_name api.uk-io.com;
    ssl_certificate /etc/nginx/cloudflare-ssl/ssl.pem;
    ssl_certificate_key /etc/nginx/cloudflare-ssl/ssl.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;
    access_log /var/log/nginx/medicine-api.access.log;
    error_log /var/log/nginx/medicine-api.error.log;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
    }
}
